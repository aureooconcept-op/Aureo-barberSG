<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ÁUREO</title><meta name="theme-color" content="#1d1f21"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--c:#2b2e30;--d:#1d1f21;--j:#1fa37a;--m:#8fdcc0;--g:#8a9092;--i:#f1eee4;--o:#d9b25e;--l:#3a3d3f}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}[hidden]{display:none!important}
body{margin:auto;max-width:820px;min-height:100vh;padding:0 14px calc(92px + env(safe-area-inset-bottom));background:radial-gradient(700px 360px at 90% -4%,rgba(31,163,122,.25),transparent 70%),var(--d);color:var(--i);font:400 15px/1.5 Poppins,system-ui,sans-serif}
header{position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;align-items:center;padding:calc(12px + env(safe-area-inset-top)) 2px 12px;background:linear-gradient(var(--d) 70%,transparent)}
.w{font-weight:700;letter-spacing:.28em;line-height:1;white-space:nowrap}header .w{font-size:19px}
.a{font-style:normal;position:relative;display:inline-block}.a::after{content:"";position:absolute;left:52%;top:-.2em;width:.34em;height:.055em;background:var(--o);transform:rotate(-38deg);transform-origin:left}
.pill{display:inline-block;background:var(--o);color:#2b2e30;font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;padding:3px 9px;border-radius:99px}
.splash{text-align:center;padding:12vh 0 28px}.splash .w{font-size:clamp(40px,12vw,72px)}.sub{color:var(--o);letter-spacing:.3em;font-size:12px;margin-top:18px}.tg{color:var(--g);letter-spacing:.26em;font-size:10px;margin-top:8px}
.sign{box-shadow:0 0 0 1px var(--l),0 0 38px rgba(31,163,122,.25) inset;position:relative}.sign::after{content:"";position:absolute;left:12%;right:12%;bottom:-1px;height:2px;background:var(--m);box-shadow:0 0 14px var(--j)}
.card{background:linear-gradient(180deg,#25282a,#202325);border:1px solid var(--l);border-radius:18px;padding:16px;margin:0 0 14px}
h3{margin:0 0 12px;font-size:11px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--o)}
input,select,button{font:inherit;color:var(--i);background:#171819;border:1px solid var(--l);border-radius:12px;padding:12px;width:100%;margin:0 0 8px;transition:.15s}
input:focus,select:focus{outline:0;border-color:var(--j);box-shadow:0 0 0 3px rgba(31,163,122,.25)}
button{cursor:pointer}button:active{transform:scale(.97)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.row>*{flex:1}input[type=checkbox]{width:auto;flex:0}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin-bottom:8px}.tile{margin:0;padding:16px 10px;text-align:center;min-height:78px}.tile b{display:block;font-weight:600}.tile small{color:var(--g)}
.tile.on{background:linear-gradient(145deg,var(--j),#14785a);border-color:var(--m);box-shadow:0 0 22px rgba(31,163,122,.45);color:#fff}.tile.on small{color:#d5f5e9}
.go{background:linear-gradient(145deg,var(--j),#17886a);border:0;color:#0d1f19;font-weight:700;letter-spacing:.06em;padding:15px;box-shadow:0 8px 24px rgba(31,163,122,.35)}
.tot{display:flex;justify-content:space-between;align-items:baseline;margin:10px 2px}.tot b,.big{font-size:30px;font-weight:700;color:var(--o)}.big{text-align:center}
.hero{min-height:118px;border-radius:20px;padding:18px;margin:0 0 14px;background:linear-gradient(120deg,rgba(31,163,122,.55),rgba(16,38,31,.92) 70%),var(--c);border:1px solid rgba(143,220,192,.35);box-shadow:0 0 40px rgba(31,163,122,.18)}.hero .big{text-align:left;font-size:38px;color:var(--i);margin:6px 0 0}.hero small{color:var(--m)}
.k{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}.k div{background:#171819;border:1px solid var(--l);border-radius:12px;padding:12px}.k b{display:block;font-size:20px;color:var(--m)}.k span{color:var(--g);font-size:11px;display:block}
table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:8px 4px;border-bottom:1px solid var(--l);text-align:right}th{color:var(--g);font-weight:500;font-size:11px;letter-spacing:.1em;text-transform:uppercase}td:first-child,th:first-child{text-align:left}.hot td{color:var(--o)}
a{color:var(--m)}small{color:var(--g)}
.sk{height:84px;border-radius:18px;margin:0 0 14px;background:linear-gradient(90deg,#25282a 30%,#2f3335 50%,#25282a 70%) 0 0/200% 100%;animation:sh 1.2s infinite}@keyframes sh{to{background-position:-200% 0}}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:center;background:rgba(29,31,33,.9);backdrop-filter:blur(12px);border-top:1px solid var(--l);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;max-width:120px;border:0;border-radius:0;background:none;color:var(--g);font-size:10px;letter-spacing:.06em;padding:10px 2px 8px;margin:0;display:flex;flex-direction:column;align-items:center;gap:4px}
nav svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}nav .on{color:var(--m);box-shadow:inset 0 2px 0 var(--j)}
#toast{position:fixed;top:14px;left:50%;transform:translateX(-50%);background:var(--j);color:#0d1f19;padding:11px 18px;border-radius:12px;display:none;z-index:9;font-weight:600;box-shadow:0 8px 30px rgba(0,0,0,.5);max-width:92%}
.nav2{display:flex;gap:8px;align-items:center}.nav2 button{width:44px;margin:0}.bar{height:8px;background:#171819;border-radius:9px;margin-top:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--j)}.gold{color:var(--o);font-size:18px}
</style></head><body>
<div id="toast"></div><header hidden><div class="w"><i class="a">A</i>UREO</div><span class="pill" id="who"></span></header><div id="v"></div><nav id="nav"></nav>
<script>
const $=s=>document.querySelector(s),$m=n=>'$'+Math.round(n).toLocaleString('es-CO'),
 esc=s=>String(s??'').replace(/[&<>"']/g,c=>'&#'+c.charCodeAt()+';'),
 today=()=>new Date(Date.now()-5*36e5).toISOString().slice(0,10),
 D=['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'],V=h=>$('#v').innerHTML=h,
 opts=(l,s)=>l.map(x=>`<option value="${x.id}" ${x.id==s?'selected':''}>${esc(x.name)}</option>`).join(''),
 ex=n=>C.services.find(s=>s.name==n&&s.kind=='extra')?.price||0;
let U,C,AV,TABS,st={};
async function api(p,m='GET',b){const r=await fetch('/api/'+p,{method:m,headers:{'Content-Type':'application/json'},body:b&&JSON.stringify(b)}),j=await r.json().catch(()=>({}));if(!r.ok)throw Error(j.error||'Error');return j}
function toast(t,ms=2200){const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(toast.k);toast.k=setTimeout(()=>e.style.display='none',ms)}
async function T(f){try{await f()}catch(e){toast(e.message)}}
api('boot').then(start,login);

const IC={reg:'<path d="M12 5v14M5 12h14"/>',res:'<path d="M5 20V10M12 20V4M19 20v-7"/>',ag:'<rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/>',cl:'<circle cx="9" cy="8" r="3"/><path d="M3 20c0-4 3-6 6-6s6 2 6 6M16 11a3 3 0 100-6M21 20c0-3-2-5-4-5.5"/>',aj:'<path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/>',out:'<path d="M10 5H5v14h5M15 8l4 4-4 4M19 12H9"/>'};
function login(){$('#nav').innerHTML='';$('header').hidden=true;V(`<div class="splash"><div class="w"><i class="a">A</i>UREO</div><div class="sub">EST. 2026</div><div class="tg">STYLE · CULTURE · IDENTITY</div></div><div class="card sign"><input id="u" placeholder="Usuario" autocapitalize="off" autocomplete="username"><input id="p" type="password" placeholder="Clave" autocomplete="current-password"><button class="go" onclick="T(async()=>{await api('login','POST',{username:$('#u').value,password:$('#p').value});start(await api('boot'))})">Entrar</button></div>`)}
function start(b){U=b.u;C=b;$('header').hidden=false;$('#who').textContent=U.name;const a=U.role=='admin';
 TABS=[['Registrar',reg,'reg'],[a?'Reportes':'Mis números',resumen,'res'],['Agenda',agenda,'ag'],...(a?[['Clientes',clientes,'cl'],['Ajustes',ajustes,'aj']]:[])];
 $('#nav').innerHTML=TABS.map((x,i)=>`<button onclick="go(${i})"><svg viewBox="0 0 24 24">${IC[x[2]]}</svg>${x[0]}</button>`).join('')+`<button onclick="api('logout','POST').then(login)"><svg viewBox="0 0 24 24">${IC.out}</svg>Salir</button>`;go(0)}
function go(i){document.querySelectorAll('nav button').forEach((b,j)=>b.classList.toggle('on',i==j));T(TABS[i][1])}

// ---------- Registrar ----------
let H={n:0,t:0};
const hero=()=>{const e=$('#hero');if(e)e.innerHTML=`<span class="pill">Hoy</span><div class="big">${$m(H.t)}</div><small>${H.n} cortes registrados</small>`};
function reg(){const cs=C.services.filter(s=>s.kind=='corte'&&s.active),pr=C.products.filter(p=>p.active);st={s:cs[0]?.id,b:0,m:0};
 V(`<div class="hero" id="hero"></div>
 <div class="card"><h3>${U.role=='admin'?'Barbero':'Registrando como'}</h3>${U.role=='admin'?`<select id="cb">${opts(C.barbers,U.id)}</select>`:`<input type="hidden" id="cb" value="${U.id}"><div class="row" style="justify-content:space-between"><b>${esc(U.name)}</b><small>Fijo: solo tu perfil</small></div>`}</div>
 <div class="card"><h3>Servicio</h3><div class="tiles">${cs.map(s=>`<button class="tile" data-s="${s.id}" onclick="st.s=${s.id};upd()"><b>${esc(s.name)}</b><small>${$m(s.price)}</small></button>`).join('')}</div>
 <div class="tiles"><button class="tile" id="bb" onclick="st.b^=1;upd()"><b>+ Barba</b><small>${$m(ex('Barba'))}</small></button><button class="tile" id="mm" onclick="st.m^=1;upd()"><b>+ Mascarilla</b><small>${$m(ex('Mascarilla'))}</small></button></div>
 <h3 style="margin-top:14px">Cliente (opcional)</h3><div class="row"><input id="cn" placeholder="Nombre"><input id="cp" placeholder="Teléfono" inputmode="tel"></div>
 <div class="tot"><span>Total</span><b id="tot"></b></div><button class="go" onclick="T(saveCut)">Guardar corte</button></div>
 <div class="card"><h3>Venta de producto</h3><select id="sp" onchange="upd2()">${pr.map(p=>`<option value="${p.id}" data-p="${p.price}">${esc(p.name)} · ${$m(p.price)}</option>`).join('')}</select>
 <div class="row"><input id="sq" type="number" value="1" min="1" oninput="upd2()"><div class="big" id="st2"></div></div><button class="go" onclick="T(saveSale)">Guardar venta</button></div>`);
 upd();upd2();hero();const d=today();api(`stats?lite=1&from=${d}&to=${d}`).then(s=>{H.n=s.per.reduce((a,x)=>a+x.cuts,0);H.t=s.per.reduce((a,x)=>a+x.cut_rev+x.sales_rev,0);hero()}).catch(()=>{})}
function upd(){document.querySelectorAll('[data-s]').forEach(e=>e.classList.toggle('on',e.dataset.s==st.s));$('#bb').classList.toggle('on',!!st.b);$('#mm').classList.toggle('on',!!st.m);
 $('#tot').textContent=$m((C.services.find(s=>s.id==st.s)?.price||0)+st.b*ex('Barba')+st.m*ex('Mascarilla'))}
function upd2(){const o=$('#sp').selectedOptions[0];$('#st2').textContent=o?$m(o.dataset.p*$('#sq').value):''}
function saveCut(){const s=C.services.find(x=>x.id==st.s);if(!s)return;const body={barber_id:$('#cb').value,service_id:st.s,beard:st.b,mask:st.m,name:$('#cn').value,phone:$('#cp').value},p=s.price+st.b*ex('Barba')+st.m*ex('Mascarilla');
 H.n++;H.t+=p;hero();toast('Corte guardado · '+$m(p));st.b=st.m=0;$('#cn').value=$('#cp').value='';upd();
 api('cuts','POST',body).catch(e=>{H.n--;H.t-=p;hero();toast('NO SE GUARDÓ: '+e.message,6000);if($('#cn')){st.s=body.service_id;st.b=body.beard;st.m=body.mask;$('#cn').value=body.name;$('#cp').value=body.phone;upd()}})}
function saveSale(){const o=$('#sp').selectedOptions[0];if(!o)return;const q=Math.max(1,+$('#sq').value||1),t=o.dataset.p*q;
 H.t+=t;hero();toast('Venta guardada · '+$m(t));$('#sq').value=1;upd2();
 api('sales','POST',{barber_id:$('#cb').value,product_id:o.value,qty:q}).catch(e=>{H.t-=t;hero();toast('NO SE GUARDÓ: '+e.message,6000)})}

// ---------- Reportes / Mis números ----------
async function resumen(){const t=today();WK=mon(t);V(`<div id="w"><div class="sk"></div></div><h3 style="margin:18px 2px 10px">Resumen por periodo</h3><div class="card row"><input type="date" id="f" value="${t.slice(0,8)}01"><input type="date" id="t" value="${t}"></div><div id="r"><div class="sk"></div><div class="sk"></div></div>`);
 $('#f').onchange=$('#t').onchange=()=>T(load);T(week);await load()}
async function load(){const s=await api(`stats?from=${$('#f').value}&to=${$('#t').value}`),S=k=>s.per.reduce((a,x)=>a+x[k],0),tc=S('cut_rev'),ts=S('sales_rev');
 $('#r').innerHTML=`<div class="card"><div class="k">${[['Cortes',S('cuts')],['Clientes registrados',s.clients],['Ingresos por cortes',$m(tc)],['Ventas de productos',$m(ts)],['Total',$m(tc+ts)]].map(x=>`<div><span>${x[0]}</span><b>${x[1]}</b></div>`).join('')}</div></div>
 <div class="card"><h3>Por barbero</h3><table><tr><th>Barbero<th>Cortes<th>Cortes $<th>Ventas $${s.per.map(x=>`<tr><td>${esc(x.name)}<td>${x.cuts}<td>${$m(x.cut_rev)}<td>${$m(x.sales_rev)}`).join('')}</table></div>
 <div class="card"><h3>Proyección mensual · base ${s.proj.meses} mes(es) cerrado(s)</h3><div class="k">${s.proj.p.map(p=>`<div><span>En ${p.k} ${p.k>1?'meses':'mes'}</span><b>${$m(p.rev)}</b><span>${p.cuts} cortes/mes</span></div>`).join('')}</div>${s.proj.meses<3?'<small>Con poco historial la proyección es solo orientativa.</small>':''}</div>`}

// ---------- Semana: renta y comisión ----------
let WK,PCT=10;
const addD=(d,n)=>{const x=new Date(d+'T00:00:00Z');x.setUTCDate(x.getUTCDate()+n);return x.toISOString().slice(0,10)},
 mon=d=>addD(d,-((new Date(d+'T00:00:00Z').getUTCDay()+6)%7)),
 dm=d=>new Date(d+'T00:00:00Z').toLocaleDateString('es-CO',{day:'numeric',month:'short',timeZone:'UTC'});
async function week(){const w=await api('week?start='+WK),a=U.role=='admin',x=w.rows[0]||{cuts:0,cut_rev:0,units:0,commission:0};
 let body;
 if(a){const g=r=>r.cut_rev+r.commission,tot=w.rows.reduce((s,r)=>s+Math.min(g(r),w.rent),0);
  body=`<div class="card"><h3>Pago semanal por barbero</h3><table><tr><th>Barbero<th>Cortes $<th>Comisión<th>Neto${w.rows.map(r=>`<tr><td>${esc(r.name)}<td>${$m(r.cut_rev)}<td>${$m(r.commission)}<td><b>${$m(Math.max(0,g(r)-w.rent))}</b>`).join('')}</table><small>Renta de silla: ${$m(w.rent)} por barbero · Renta cubierta esta semana: ${$m(tot)}</small></div>`}
 else{const g=x.cut_rev+x.commission,net=Math.max(0,g-w.rent),pc=Math.min(100,Math.round(g/w.rent*100));
  body=`<div class="hero"><span class="pill">A recibir esta semana</span><div class="big">${$m(net)}</div><small>${g>=w.rent?'Ya con la renta de la silla descontada':'Te faltan '+$m(w.rent-g)+' para cubrir la renta'}</small></div>
  <div class="card"><h3>Cómo se calcula</h3><table><tr><td>Cortes (${x.cuts})<td>${$m(x.cut_rev)}<tr><td>Comisión de productos (${w.pct}%)<td>+ ${$m(x.commission)}<tr><td>Renta de silla<td>− ${$m(w.rent)}<tr><td><b>A recibir</b><td><b class="gold">${$m(net)}</b></table>
  <small>Renta cubierta · ${$m(Math.min(g,w.rent))} de ${$m(w.rent)}</small><div class="bar"><i style="width:${pc}%"></i></div></div>
  <div class="card"><h3>Productos vendidos · ${x.units}</h3><table>${w.items.map(i=>`<tr><td>${esc(i.name)} ×${i.qty}<td>ganancia ${$m(i.profit)}<td><b>${$m(i.profit*w.pct/100)}</b>`).join('')||'<tr><td><small>Sin ventas esta semana</small>'}</table><small>Recibes el ${w.pct}% de la ganancia, no del precio de venta</small></div>`}
 $('#w').innerHTML=`<div class="card nav2"><button onclick="WK=addD(WK,-7);T(week)" aria-label="Semana anterior">‹</button><div style="text-align:center;flex:1"><b>Semana ${dm(WK)} – ${dm(addD(WK,6))}</b><br><small>Lunes a domingo${WK==mon(today())?' · en curso':''}</small></div><button onclick="WK=addD(WK,7);T(week)" aria-label="Semana siguiente">›</button></div>`+body}

// ---------- Agenda ----------
async function agenda(){const[ap,av]=await Promise.all([api('appointments?from='+today()),api('availability')]),a=U.role=='admin';AV=av;
 V(`<div class="card"><h3>Nueva cita</h3>${a?`<select id="ab">${opts(C.barbers)}</select>`:''}<div class="row"><input id="an" placeholder="Cliente"><input id="ap" placeholder="Teléfono" inputmode="tel"></div><input id="at" type="datetime-local"><button class="go" onclick="T(addAp)">Agendar</button></div>
 <div class="card"><h3>Próximas citas</h3>${ap.map(x=>`<p><b>${x.starts_at.replace('T',' ')}</b> · ${esc(x.barber)} · ${esc(x.client||'—')} <a href="#" onclick="T(()=>cancel(${x.id}));return false">cancelar</a></p>`).join('')||'<small>Sin citas</small>'}</div>
 <div class="card"><h3>Disponibilidad${a?'':' (mi horario)'}</h3>${a?`<select id="vb" onchange="edAv()">${opts(C.barbers)}</select><div id="ev"></div><button class="go" onclick="T(saveAv)">Guardar disponibilidad</button>`
 :D.map((d,i)=>{const r=av.find(x=>x.weekday==i);return`<p>${d}: ${r?r.start+' – '+r.end:'libre / no trabaja'}</p>`}).join('')}</div>`);if(a)edAv()}
function edAv(){const b=$('#vb').value;$('#ev').innerHTML=D.map((d,i)=>{const r=AV.find(x=>x.barber_id==b&&x.weekday==i)||{};return`<div class="row"><span>${d}</span><input type="time" value="${r.start||''}"><input type="time" value="${r.end||''}"></div>`}).join('')}
async function saveAv(){const b=+$('#vb').value,rows=[...document.querySelectorAll('#ev .row')].map((e,i)=>({weekday:i,start:e.children[1].value,end:e.children[2].value})).filter(r=>r.start&&r.end);
 await api('availability','PUT',{barber_id:b,rows});AV=AV.filter(x=>x.barber_id!=b).concat(rows.map(r=>({...r,barber_id:b})));toast('Guardado')}
async function addAp(){await api('appointments','POST',{barber_id:$('#ab')?.value,name:$('#an').value,phone:$('#ap').value,starts_at:$('#at').value});toast('Cita creada');agenda()}
async function cancel(id){await api('appointments/'+id,'DELETE');agenda()}

// ---------- Clientes ----------
const wa=c=>`https://wa.me/${c.phone}?text=${encodeURIComponent(`Hola ${c.name||''}, ya va siendo hora de tu próximo corte 💈 ¿Te agendamos?`)}`;
const cl=c=>`<tr class="${c.d<=7?'hot':''}"><td>${esc(c.name||c.phone)}<td>${c.visits}<td>${c.d==999?'—':c.d<0?'vencido '+-c.d+'d':'en '+c.d+'d'}<td><a href="${wa(c)}" target="_blank">WhatsApp</a>`;
async function clientes(){const cs=await api('clients'),now=Date.now();
 cs.forEach(c=>c.d=c.last?Math.round((new Date(c.last.replace(' ','T')).getTime()+c.cycle_days*864e5-now)/864e5):999);cs.sort((a,b)=>a.d-b.d);
 const H='<tr><th>Cliente<th>Cortes<th>Próximo corte<th>';
 V(`<div class="card"><h3>Próximos a volver (≤ 7 días o vencidos)</h3><table>${H}${cs.filter(c=>c.d<=7).map(cl).join('')||'<tr><td colspan=4><small>Nadie por ahora</small>'}</table></div>
 <div class="card"><h3>Todos los clientes (${cs.length})</h3><table>${H}${cs.map(cl).join('')}</table></div>`)}

// ---------- Ajustes ----------
const prow=x=>`<div class="r" data-id="${x.id||''}" style="margin-bottom:12px"><div class="row"><input class="n" value="${esc(x.name)}" placeholder="Producto"><input class="p" type="number" value="${x.price??''}" placeholder="Venta" oninput="pf(this)"><input class="c" type="number" value="${x.cost??''}" placeholder="Costo" oninput="pf(this)"></div><div class="row"><label><input class="a" type="checkbox" ${x.active==0?'':'checked'}> activo</label><small class="pf"></small></div></div>`;
function pf(e){const r=e.closest('.r'),v=(+r.querySelector('.p').value)-(+r.querySelector('.c').value);r.querySelector('.pf').textContent=`Ganancia ${$m(v)} · barbero ${$m(v*PCT/100)}`}
const pcard=()=>`<div class="card"><h3>Productos y márgenes (venta · costo)</h3><div id="products">${C.products.map(prow).join('')}</div><div class="row"><button onclick="add('products')">+ Agregar</button><button class="go" onclick="T(()=>saveCat('products'))">Guardar</button></div><small>Ganancia = venta − costo. Solo el administrador ve y edita el costo.</small></div>`;
const cfgCard=S=>`<div class="card"><h3>Reglas semanales</h3><div class="row"><label>Renta de silla por semana<input id="rent" type="number" value="${S.rent_weekly}"></label><label>% del barbero en productos<input id="pct" type="number" min="0" max="100" value="${S.commission_pct}"></label></div><button class="go" onclick="T(saveCfg)">Guardar reglas</button><small>La semana va de lunes a domingo.</small></div>`;
async function saveCfg(){await api('settings','PUT',{rent_weekly:$('#rent').value,commission_pct:$('#pct').value});PCT=+$('#pct').value;toast('Reglas guardadas')}
const rw=x=>`<div class="row r" data-id="${x.id||''}"><input class="n" value="${esc(x.name)}" ${x.kind=='extra'?'readonly':''} placeholder="Nombre"><input class="p" type="number" value="${x.price??''}" placeholder="Precio"><label><input class="a" type="checkbox" ${x.active==0?'':'checked'}> activo</label></div>`;
function add(t){$('#'+t).insertAdjacentHTML('beforeend',(t=='products'?prow:rw)({}))}
async function saveCat(t){await api('catalog/'+t,'PUT',{items:[...document.querySelectorAll('#'+t+' .r')].map(e=>({id:+e.dataset.id||null,name:e.querySelector('.n').value.trim(),price:+e.querySelector('.p').value,cost:+(e.querySelector('.c')?.value||0),active:+e.querySelector('.a').checked}))});C=await api('catalog');toast('Precios guardados')}
async function saveUser(){await api('users','POST',{name:$('#un').value,username:$('#uu').value,password:$('#up').value,role:$('#ur').value,active:$('#ua').checked});toast('Usuario guardado');C=await api('catalog')}
async function ajustes(){const S=await api('settings');const ed=(t,n,l)=>`<div class="card"><h3>${n}</h3><div id="${t}">${l.map(rw).join('')}</div><div class="row"><button onclick="add('${t}')">+ Agregar</button><button class="go" onclick="T(()=>saveCat('${t}'))">Guardar</button></div></div>`;
 V(ed('services','Servicios y precios (Barba y Mascarilla se suman al corte)',C.services)+cfgCard(S)+pcard()+
 `<div class="card"><h3>Usuarios (mismo usuario = actualizar / restablecer clave)</h3><div class="row"><input id="un" placeholder="Nombre"><input id="uu" placeholder="Usuario" autocapitalize="off"></div><div class="row"><input id="up" type="password" placeholder="Clave nueva"><select id="ur"><option value="barbero">Barbero</option><option value="admin">Admin</option></select><label><input id="ua" type="checkbox" checked> activo</label></div><button class="go" onclick="T(saveUser)">Guardar usuario</button><small>Clave inicial de todos: cambiar123 — cámbiala.</small></div>
 <div class="card"><h3>Exportar</h3>${['cuts','sales','clients','resumen'].map(n=>`<a href="/api/export/${n}.csv">${n}.csv</a>`).join(' · ')}</div>`);PCT=S.commission_pct;document.querySelectorAll('#products .r input.p').forEach(pf)}
</script></body></html>
